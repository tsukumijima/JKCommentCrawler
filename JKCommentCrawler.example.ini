[Default]

# ====================  環境設定  ====================
# JKCommentCrawler.ini にコピーした上で、各自の環境に合わせて編集してください

# 過去ログを保存するフォルダ
jkcomment_folder = ./kakolog/

# ニコニコアカウントへのログイン方式 (oauth または cookie)
# 継続収集にはトークンが自動更新される oauth を推奨します
# oauth の場合はプロジェクトルートの oauth.json、cookie の場合は cookies.json が参照されます
auth_method = oauth

# 定期実行が失敗したときに報告する Discord の Webhook URL (未指定なら通知は無効)
discord_webhook_url =

# 通知でメンションする Discord ユーザー ID (省略可)
# ID は Discord の設定から開発者モードを有効化し、自分のユーザーアイコンを右クリックで出てくる [IDをコピー] から取得できる
discord_mention_to =
