[Default]

# ====================  環境設定  ====================
# JKCommentCrawler.ini にコピーした上で、各自の環境に合わせて編集してください

# 過去ログを保存するフォルダ
jkcomment_folder = ./kakolog/

# ニコニコの認証方式 (oauth または cookie)
# 継続収集にはトークンが自動更新される oauth を推奨します
# oauth の場合はプロジェクトルートの oauth.json、cookie の場合は cookies.json が参照されます
auth_method = oauth
